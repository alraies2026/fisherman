<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title> رأس البسيط</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #e2e8f0; padding: 16px; min-height: 100vh; }
    .container { max-width: 400px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
    .icon { font-size: 2rem; margin-bottom: 8px; }
    .label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .value { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .fish-box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 16px; border: 1px solid #334155; }
    .bar { height: 8px; background: #334155; border-radius: 4px; margin: 12px 0; overflow: hidden; }
    .fill { height: 100%; background: #22c55e; border-radius: 4px; transition: width 0.5s; }
    .tips-box { background: #1e3a8a; padding: 16px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #3b82f6; grid-column: span 2; }
    .tips-title { color: #93c5fd; font-size: 0.85rem; margin-bottom: 8px; font-weight: bold; }
    .tips-text { font-size: 0.9rem; line-height: 1.6; color: #e0f2fe; }
    .note { background: #1e293b; padding: 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 16px; border: 1px dashed #475569; }
    button { width: 100%; padding: 14px; margin-bottom: 8px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .primary { background: #38bdf8; color: #0b1120; }
    .secondary { background: #334155; color: #e2e8f0; }
    .status { text-align: center; font-size: 0.8rem; margin-top: 8px; padding: 8px; border-radius: 6px; }
    .error { color: #ef4444; background: rgba(239,68,68,0.1); }
    .success { color: #22c55e; background: rgba(34,197,94,0.1); }
    .debug { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 0.7rem; margin-top: 12px; overflow-x: auto; direction: ltr; text-align: left; display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>🌊 رأس البسيط</h1>
  
  <div class="grid">
    <div class="card">
      <div class="icon"></div>
      <div class="label">الرياح</div>
      <div class="value" id="wind">--</div>
    </div>
    <div class="card">
      <div class="icon">🧭</div>
      <div class="label">الاتجاه</div>
      <div class="value" id="dir">--</div>
    </div>
    <div class="card">      <div class="icon">🌊</div>
      <div class="label">الأمواج</div>
      <div class="value" id="wave">--</div>
    </div>
    <div class="card">
      <div class="icon">🌡️</div>
      <div class="label">الضغط</div>
      <div class="value" id="press">--</div>
    </div>
  </div>
  <div class="fish-box">
    <div class="label">مؤشر الصيد 🎣</div>
    <div class="value" id="fish" style="font-size: 2rem; margin: 8px 0;">--%</div>
    <div class="bar"><div class="fill" id="fill" style="width: 0%"></div></div>
    <div id="fishText">--</div>
  </div>
  <div class="tips-box">
    <div class="tips-title">🎯 نصائح لصياد الشاطئ</div>
    <div class="tips-text" id="tips-text">انتظر التحميل...</div>
  </div>
  <div class="note">⚠️ بيانات حية من Open-Meteo</div>
  <button class="primary" onclick="fetchData()">🔄 تحديث الآن</button>
  <button class="secondary" onclick="requestNotif()">🔔 التنبيهات</button>
  <button class="secondary" id="installBtn" style="display:none;">📲 تثبيت كتطبيق</button>
  <div class="status" id="status">جاري البدء...</div>
  <div class="debug" id="debug"></div>
</div>
<script>
  const LAT = 35.9333;
  const LON = 35.9167;
  const windDirs = ['شمال','شمال شرق','شرق','جنوب شرق','جنوب','جنوب غرب','غرب','شمال غرب'];
  
  async function fetchData() {
    const status = document.getElementById('status');
    status.innerHTML = ' جاري جلب البيانات...';
    status.className = 'status';
    
    try {
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=wind_speed_10m,wind_direction_10m,surface_pressure&timezone=Asia/Damascus`;
      const marineUrl = `https://marine-api.open-meteo.com/v1/marine?latitude=${LAT}&longitude=${LON}&current=wave_height&timezone=Asia/Damascus`;
      
      const [wRes, mRes] = await Promise.all([fetch(weatherUrl), fetch(marineUrl)]);
      
      if (!wRes.ok) throw new Error(`Weather API: ${wRes.status}`);
            const w = await wRes.json();
      const m = mRes.ok ? await mRes.json() : null;
      
      const wind = w.current.wind_speed_10m;
      const wDir = w.current.wind_direction_10m;
      const pressHpa = w.current.surface_pressure;
      const pressMmhg = (pressHpa * 0.750062).toFixed(1);
      const wave = m && m.current && m.current.wave_height ? m.current.wave_height : 0;
      const dirName = windDirs[Math.round(wDir/45)%8];
      
      // عرض البيانات
      updateUI(wind, dirName, wave, pressMmhg);
      
      // توليد النصائح (هنا السر!)
      generateShoreTips(wind, wave, dirName, pressHpa);
      
      status.innerHTML = `✅ بيانات حقيقية - ${new Date().toLocaleTimeString('ar-SY')}`;
      status.className = 'status success';
      
      // حفظ كل شيء في الكاش
      saveData({wind, wDir, wave, pressMmhg, score: 0, time: new Date().toISOString()});
      
    } catch (err) {
      console.error('Error:', err);
      status.innerHTML = `⚠️ فشل الاتصال - عرض البيانات المحفوظة`;
      status.className = 'status error';
      
      // إذا فشل الاتصال، نحاول استخدام البيانات القديمة لتوليد النصائح
      const cached = localStorage.getItem('seaData');
      if (cached) {
        const d = JSON.parse(cached);
        // إعادة حساب اسم الاتجاه من الزاوية المحفوظة
        const savedDirName = windDirs[Math.round(d.wDir/45)%8] || 'غير محدد';
        updateUI(d.wind, savedDirName, d.wave, d.pressMmhg);
        generateShoreTips(d.wind, d.wave, savedDirName, 1013); // ضغط تقريبي
        status.innerHTML += ' (من الذاكرة)';
      }
    }
  }
  function updateUI(wind, dir, wave, press) {
    document.getElementById('wind').textContent = `${Math.round(wind)} كم/س`;
    document.getElementById('dir').textContent = dir;
    document.getElementById('wave').textContent = `${wave.toFixed(2)} م`;
    document.getElementById('press').textContent = `${press} mmHg`;
    
    // حساب سريع للمؤشر للعرض
    let score = 0;
    if (wind >= 5 && wind <= 15) score += 35; else if (wind < 25) score += 25; else score += 10;
    if (wave < 0.5) score += 35; else if (wave < 1) score += 25; else score += 10;    score += 30; // ضغط ثابت تقريبي
    
    document.getElementById('fish').textContent = `${score}%`;
    document.getElementById('fill').style.width = `${score}%`;
    document.getElementById('fill').style.background = score > 70 ? '#22c55e' : '#f59e0b';
    document.getElementById('fishText').textContent = score > 70 ? '🟢 ممتاز' : '🟡 مقبول';
  }
  function generateShoreTips(wind, wave, dir, pressure) {
    let tips = [];
    
    if (dir === 'جنوب') tips.push("✅ رياح جنوبية: ممتازة للشاطئ، الأسماك قريبة.");
    else if (dir.includes('غرب')) tips.push(" رياح غربية: ابحث عن مكان محمي من الموج.");
    else if (dir === 'شمال') tips.push("🌬️ رياح شمالية: غالباً هادئة ومناسبة للصب.");
    
    if (wind < 10) tips.push("🎯 هدوء نسبي: استخدم خيوطاً خفيفة (0.20-0.25).");
    else if (wind <= 20) tips.push("💨 سرعة متوسطة: استخدم أوزاناً (80-120 غرام).");
    else tips.push("⚠️ رياح قوية: استخدم خيوطاً قوية وأوزان ثقيلة (150+).");
    
    if (wave < 0.5) tips.push("✅ ارتفاع مثالي: الأمواج تحرك الطعم وتجذب الأسماك.");
    else if (wave >= 1.5) tips.push(" أمواج عالية: خطر للشاطئ، انتظر الهدوء.");
    
    if (pressure > 1015) tips.push("📈 ضغط مرتفع: الأسماك نشطة وتتغذى!");
    
    const hour = new Date().getHours();
    if (hour >= 5 && hour <= 8) tips.push("🌅 وقت الذروة الصباحي: ركز على البوري والسرفس.");
    else if (hour >= 17 && hour <= 20) tips.push("🌆 وقت الذروة المسائي: باركودة وقرموط نشطون.");
    
    document.getElementById('tips-text').textContent = tips.join(' ') || "ظروف اعتيادية.";
  }
  
  function saveData(data) {
    try { localStorage.setItem('seaData', JSON.stringify(data)); } catch(e){}
  }
  function requestNotif() {
    if (!("Notification" in window)) return alert('المتصفح لا يدعم الإشعارات');
    Notification.requestPermission().then(perm => alert(perm === 'granted' ? '✅ تم' : '❌ رفض'));
  }
  
  // PWA Install Logic
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;    if (outcome === 'accepted') document.getElementById('installBtn').style.display = 'none';
    deferredPrompt = null;
  });
  
  // Service Worker
  if ('serviceWorker' in navigator) {
    const swCode = `self.addEventListener('install', e => self.skipWaiting()); self.addEventListener('activate', e => e.waitUntil(clients.claim())); self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(e => console.error(e));
  }
  
  window.onload = () => {
    const saved = localStorage.getItem('seaData');
    if (saved) {
      const d = JSON.parse(saved);
      const dirName = windDirs[Math.round(d.wDir/45)%8] || '--';
      updateUI(d.wind, dirName, d.wave, d.pressMmhg);
      // توليد النصائح فوراً من البيانات المحفوظة عند الفتح
      generateShoreTips(d.wind, d.wave, dirName, 1013); 
    }
    fetchData(); // محاولة التحديث
  };
</script>
</body>
</html>
